# Generated by controller-gen webhook output (run: make manifests). This
# file is committed so deploy paths that don't run codegen (Helm install
# from a release artifact) still get a working webhook config.
#
# The cert-manager.io/inject-ca-from annotation is added by config/default/
# kustomization.yaml so the patch + base stay decoupled.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: secret-distribution-operator-validating-webhook
webhooks:
  - name: vexportsecret.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: secret-distribution-operator-webhook
        namespace: secret-distribution-operator
        path: /validate-secrets-mtkp-platform-v1alpha1-exportsecret
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["secrets.mtkp.platform"]
        apiVersions: ["v1alpha1"]
        resources: ["exportsecrets"]
        scope: Namespaced
  - name: vimportsecret.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: secret-distribution-operator-webhook
        namespace: secret-distribution-operator
        path: /validate-secrets-mtkp-platform-v1alpha1-importsecret
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["secrets.mtkp.platform"]
        apiVersions: ["v1alpha1"]
        resources: ["importsecrets"]
        scope: Namespaced
