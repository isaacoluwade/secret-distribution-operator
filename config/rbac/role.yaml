---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  - apiGroups: ["secrets.mtkp.platform"]
    resources: [exportsecrets, importsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["secrets.mtkp.platform"]
    resources: [exportsecrets/status, importsecrets/status]
    verbs: [get, update, patch]
  - apiGroups: ["secrets.mtkp.platform"]
    resources: [exportsecrets/finalizers, importsecrets/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
