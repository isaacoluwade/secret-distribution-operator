---
apiVersion: v1
kind: Namespace
metadata:
  name: secret-distribution-operator
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-distribution-operator
  namespace: secret-distribution-operator
  labels:
    app.kubernetes.io/name: secret-distribution-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-distribution-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-distribution-operator
    spec:
      serviceAccountName: secret-distribution-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
