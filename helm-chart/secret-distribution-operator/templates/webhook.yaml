{{- if .Values.webhook.enabled -}}
# Service the apiserver dials to reach the webhook. Selector matches the
# manager Deployment; port 443 → containerPort 9443.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sdo.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdo.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: {{ .Values.webhook.service.port }}
      protocol: TCP
      targetPort: webhook
  selector:
    {{- include "sdo.selectorLabels" . | nindent 4 }}
---
# Validating webhook covering both ExportSecret and ImportSecret. cert-manager
# injects caBundle via the inject-ca-from annotation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "sdo.fullname" . }}-validating-webhook
  labels:
    {{- include "sdo.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "sdo.fullname" . }}-serving-cert
  {{- end }}
webhooks:
  - name: vexportsecret.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "sdo.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-secrets-mtkp-platform-v1alpha1-exportsecret
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["secrets.mtkp.platform"]
        apiVersions: ["v1alpha1"]
        resources: ["exportsecrets"]
        scope: Namespaced
  - name: vimportsecret.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "sdo.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-secrets-mtkp-platform-v1alpha1-importsecret
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["secrets.mtkp.platform"]
        apiVersions: ["v1alpha1"]
        resources: ["importsecrets"]
        scope: Namespaced
{{- end }}
