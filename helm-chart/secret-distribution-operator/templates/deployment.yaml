apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sdo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sdo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sdo.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sdo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            {{- if .Values.webhook.enabled }}
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-cert-dir={{ .Values.webhook.certDir }}
            {{- end }}
            {{- if .Values.aws.region }}
            - --aws-region={{ .Values.aws.region }}
            {{- end }}
          env:
            {{- if .Values.aws.region }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            # readOnly so the manager pod, which runs with readOnlyRootFilesystem,
            # never tries to write to the cert directory.
            - name: webhook-cert
              mountPath: {{ .Values.webhook.certDir }}
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-cert
          secret:
            # Matches the secretName in the cert-manager Certificate.
            secretName: {{ include "sdo.fullname" . }}-webhook-cert
            defaultMode: 0444
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
