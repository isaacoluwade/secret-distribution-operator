---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: importsecrets.secrets.mtkp.platform
spec:
  group: secrets.mtkp.platform
  names:
    kind: ImportSecret
    listKind: ImportSecretList
    plural: importsecrets
    singular: importsecret
    shortNames: [is]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sourceArn, targetSecretName]
              properties:
                sourceArn:
                  type: string
                  pattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
                targetSecretName: { type: string }
                refreshInterval:
                  type: string
                  default: "1h"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items: { type: object }
                lastSyncedTime: { type: string, format: date-time }
                observedGeneration: { type: integer }
                sourceVersionId: { type: string }
