---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exportsecrets.secrets.mtkp.platform
spec:
  group: secrets.mtkp.platform
  names:
    kind: ExportSecret
    listKind: ExportSecretList
    plural: exportsecrets
    singular: exportsecret
    shortNames: [es]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sourceSecretName, targetPath]
              properties:
                sourceSecretName: { type: string }
                targetPath:
                  type: string
                  pattern: '^platform/(dev|staging|prod|prod-dr)/[a-z0-9-]+/[a-z0-9-]+$'
                kmsKeyArn: { type: string }
                tags:
                  type: object
                  additionalProperties: { type: string }
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items: { type: object }
                lastSyncedTime: { type: string, format: date-time }
                observedGeneration: { type: integer }
                secretArn: { type: string }
                versionId: { type: string }
