# Default values for secret-distribution-operator.

# Container image of the operator. Override `image.tag` per release.
image:
  repository: ghcr.io/example/secret-distribution-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Number of manager replicas. Leader election picks one active at a time.
replicaCount: 2

# ServiceAccount with the IRSA annotation pointing at the IAM role granted
# secretsmanager:* on platform/<env>/<ns>/<name> paths.
serviceAccount:
  create: true
  name: secret-distribution-operator
  # The IRSA role ARN MUST be set per cluster. Example:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sdo-prod
  annotations: {}

# AWS region the controller uses. Falls back to AWS_REGION env if empty.
aws:
  region: ""

# Leader election toggle. Always on in production.
leaderElection:
  enabled: true

# Pod resources. Tuned for the typical low-throughput operator workload.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod security defaults aligned with the restricted PSS profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Standard scheduling knobs.
nodeSelector: {}
tolerations: []
affinity: {}

# Metrics service + optional Prometheus Operator ServiceMonitor.
metrics:
  enabled: true
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# ValidatingAdmissionWebhooks for ExportSecret and ImportSecret. They reject
# resources at admission time that would otherwise be denied during Reconcile
# (cross-tenant paths, bad ARNs, malformed durations) — the controller still
# re-checks defensively, but the webhook is the user-facing failure surface.
#
# Disable only for emergency break-glass: turning the webhook off leaves the
# CRDs unguarded against bad specs landing in etcd.
webhook:
  enabled: true
  # Port the manager binds the webhook server on. The Service routes
  # apiserver traffic from 443 → this port.
  port: 9443
  # Directory the cert-manager-provisioned tls.crt/tls.key are mounted at.
  certDir: /tmp/k8s-webhook-server/serving-certs
  # Service the apiserver dials. Name is templated; this just controls the
  # port the Service publishes.
  service:
    port: 443
  # cert-manager Issuer + Certificate generation. If you have a cluster-wide
  # Issuer, set issuerRef and disable selfSigned.
  certManager:
    enabled: true
    # If true, create a self-signed Issuer in the release namespace and use
    # it for the serving Certificate.
    selfSigned: true
    # If selfSigned is false, the Certificate references this Issuer.
    issuerRef:
      kind: ClusterIssuer
      name: ""
  # failurePolicy: Fail blocks admission when the webhook is unreachable.
  # Ignore would silently regress policy — not a tradeoff we want by default.
  failurePolicy: Fail
  timeoutSeconds: 10
